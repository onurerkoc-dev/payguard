spring.application.name=payguard

# Veritabanı şemasını Flyway yönetir.
# Hibernate yalnızca entity ve tablo yapılarının uyumunu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate

# Controller dışında lazy relation kullanılmasını engeller.
spring.jpa.open-in-view=false

# Gerçek kurulum bilgileri harici config/application.properties dosyasına yazılır.
payguard.admin-bootstrap.enabled=false
payguard.admin-bootstrap.email=
payguard.admin-bootstrap.password=
