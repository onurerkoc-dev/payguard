# Production ortamında bağlantı bilgileri sunucunun
# environment variable değerlerinden alınır.
spring.datasource.url=${PAYGUARD_DB_URL}
spring.datasource.username=${PAYGUARD_DB_USERNAME}
spring.datasource.password=${PAYGUARD_DB_PASSWORD}

# Hosting sağlayıcısının verdiği port kullanılır.
# PORT tanımlı değilse 8080 kullanılır.
server.port=${PORT:8080}