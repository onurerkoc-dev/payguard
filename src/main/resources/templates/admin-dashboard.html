<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yönetici paneli | PayGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a th:href="@{/}"
           class="text-white text-decoration-none fs-5 fw-bold">
            PayGuard
        </a>

        <div class="d-flex align-items-center gap-3">
            <span th:text="${email}">admin@example.com</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Çıkış yap
                </button>
            </form>
        </div>
    </div>
</header>

<main class="container py-5">
    <h1 class="h2 fw-bold">Yönetici paneli</h1>
    <p class="text-muted mb-4">Kayıtlı müşterileri görüntüleyin.</p>

    <section class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Müşteriler</h2>
                <span class="badge text-bg-primary"
                      th:text="${#lists.size(customers)}">0</span>
            </div>

            <p th:if="${#lists.isEmpty(customers)}" class="text-muted mb-0">
                Henüz kayıtlı müşteri yok.
            </p>

            <div th:unless="${#lists.isEmpty(customers)}" class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Ad</th>
                        <th scope="col">Soyad</th>
                        <th scope="col">E-posta</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="customer : ${customers}">
                        <th scope="row" th:text="${customer.id}">1</th>
                        <td th:text="${customer.firstName}">Ad</td>
                        <td th:text="${customer.lastName}">Soyad</td>
                        <td th:text="${customer.email}">musteri@example.com</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

</body>
</html>
