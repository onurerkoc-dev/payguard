<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ödeme izinleri | PayGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white py-3">
    <div class="container"><strong>PayGuard</strong></div>
</header>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h1 class="h3">Ödeme izinleri</h1>
            <p class="text-muted">Bu kartın kullanım izinlerini yönetin.</p>

            <!-- Seçimler, GET metodunun doldurduğu settingsRequest'ten gelir. -->
            <form th:action="@{/cards/{id}/payment-settings(id=${cardId})}"
                  th:object="${settingsRequest}"
                  method="post">

                <div class="mb-3">
                    <label for="onlineTransactionsEnabled" class="form-label">
                        İnternet işlemleri
                    </label>
                    <select id="onlineTransactionsEnabled" class="form-select"
                            th:field="*{onlineTransactionsEnabled}">
                        <option value="true">Açık</option>
                        <option value="false">Kapalı</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="internationalTransactionsEnabled"
                           class="form-label">
                        Yurt dışı işlemleri
                    </label>
                    <select id="internationalTransactionsEnabled"
                            class="form-select"
                            th:field="*{internationalTransactionsEnabled}">
                        <option value="true">Açık</option>
                        <option value="false">Kapalı</option>
                    </select>
                    <a th:href="@{/cards/{id}/payment-settings(id=${cardId})}"
                       class="btn btn-outline-primary">
                        Ödeme izinleri
                    </a>
                </div>

                <!-- POST metodu eklenene kadar kaydetme kapalı. -->
                <button type="submit" class="btn btn-primary">
                    Kaydet
                </button>
                <a th:href="@{/cards/{id}(id=${cardId})}"
                   class="btn btn-outline-secondary">
                    Kart detayına dön
                </a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
