<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yeni sanal kart | PayGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white py-3">
    <div class="container">
        <strong>PayGuard</strong>
    </div>
</header>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Yeni sanal kart</h1>
            <p class="text-muted mb-4">Kart adı ve harcama limitlerini belirleyin.</p>

            <!-- Günlük limit, tek işlem limitinden küçükse servis hatası burada görünür. -->
            <div class="alert alert-danger"
                 th:if="${limitError}"
                 th:text="${limitError}"></div>

            <!-- Form alanları, controller'ın gönderdiği request nesnesine bağlanır. -->
            <form th:action="@{/cards/new}" th:object="${request}" method="post">

                <div class="mb-3">
                    <label for="cardName" class="form-label">Kart adı</label>
                    <input id="cardName" type="text" class="form-control"
                           th:field="*{cardName}" maxlength="50" required>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('cardName')}"
                         th:errors="*{cardName}"></div>
                </div>

                <div class="mb-3">
                    <label for="singleTransactionLimit" class="form-label">
                        Tek işlem limiti
                    </label>
                    <input id="singleTransactionLimit" type="number"
                           class="form-control"
                           th:field="*{singleTransactionLimit}"
                           min="0.01" step="0.01" required>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('singleTransactionLimit')}"
                         th:errors="*{singleTransactionLimit}"></div>
                </div>

                <div class="mb-4">
                    <label for="dailyLimit" class="form-label">Günlük limit</label>
                    <input id="dailyLimit" type="number" class="form-control"
                           th:field="*{dailyLimit}"
                           min="0.01" step="0.01" required>
                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('dailyLimit')}"
                         th:errors="*{dailyLimit}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Kart oluştur</button>
                <a th:href="@{/}" class="btn btn-outline-secondary">İptal</a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
