<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kart limitleri | PayGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white py-3">
    <div class="container">
        <strong>PayGuard</strong>
    </div>
</header>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h1 class="h3">Kart limitleri</h1>
            <p class="text-muted">
                Tek işlem ve günlük harcama limitlerini düzenleyin.
            </p>

            <!-- Günlük limit ile tek işlem limiti arasındaki kural hatası. -->
            <div th:if="${limitError != null}"
                 class="alert alert-danger"
                 th:text="${limitError}"></div>

            <form th:action="@{/cards/{id}/limits(id=${cardId})}"
                  th:object="${limitRequest}"
                  method="post">

                <div class="mb-3">
                    <label for="singleTransactionLimit" class="form-label">
                        Tek işlem limiti
                    </label>
                    <input id="singleTransactionLimit"
                           type="number" class="form-control"
                           th:field="*{singleTransactionLimit}"
                           min="0.01" step="0.01" required>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('singleTransactionLimit')}"
                         th:errors="*{singleTransactionLimit}"></div>
                </div>

                <div class="mb-4">
                    <label for="dailyLimit" class="form-label">
                        Günlük limit
                    </label>
                    <input id="dailyLimit"
                           type="number" class="form-control"
                           th:field="*{dailyLimit}"
                           min="0.01" step="0.01" required>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('dailyLimit')}"
                         th:errors="*{dailyLimit}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Kaydet
                </button>
                <a th:href="@{/cards/{id}(id=${cardId})}"
                   class="btn btn-outline-secondary">
                    Kart detayına dön
                </a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
