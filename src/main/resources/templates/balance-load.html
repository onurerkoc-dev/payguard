<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Örnek bakiye yükle | PayGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white py-3">
    <div class="container">
        <strong>PayGuard</strong>
    </div>
</header>

<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h1 class="h3">Örnek bakiye yükle</h1>
            <p class="text-muted">
                Bu işlem gerçek para transferi yapmaz.
            </p>

            <!-- amount alanı, balanceRequest DTO'sundaki amount'a bağlanır. -->
            <form th:action="@{/cards/{id}/balance(id=${cardId})}"
                  th:object="${balanceRequest}"
                  method="post">

                <div class="mb-3">
                    <label for="amount" class="form-label">Tutar</label>
                    <input id="amount" type="number" class="form-control"
                           th:field="*{amount}"
                           min="0.01" step="0.01" required>

                    <div class="text-danger small"
                         th:if="${#fields.hasErrors('amount')}"
                         th:errors="*{amount}"></div>
                </div>

                <button type="submit" class="btn btn-primary">
                    Bakiyeyi yükle
                </button>
                <a th:href="@{/cards/{id}(id=${cardId})}"
                   class="btn btn-outline-secondary">
                    İptal
                </a>
            </form>
        </div>
    </div>
</main>

</body>
</html>
